experiment: known_channel_dps_v1
seed: 233
device: auto

dataset:
  path: datasets/dps_v1/dps_v1.h5
  split_seed: 20260916
  split_ratios:
    train: 0.8
    validation: 0.1
    test: 0.1
  num_workers: 4

model:
  in_channels: 2
  out_channels: 2
  base_channels: 64
  channel_multipliers: [1, 2, 4, 8]
  num_res_blocks: 2
  dropout: 0.05

diffusion:
  steps: 1000
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_root: outputs/train
  resume_output_dir: null  # null: new run; set an existing output directory to resume
  epochs: 100  # final target epoch, including epochs already completed before resume
  batch_size: 512
  learning_rate: 0.0002
  weight_decay: 0.00001
  gradient_clip: 1.0
  save_every_epochs: 10
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001

validation:
  seed: 10233
  sample_count: null
  batch_size: 32
  noise_repeats: 1

dps:
  sampling_steps: 250
  guidance_scale: 0.05
  likelihood: auto
  measurement_eps: 1.0e-8
  clip_denoised: false

dps_validation:
  enabled: true
  every_epochs: 10
  seed: 20233
  sample_count: 8
  batch_size: 4
  sampling_steps: 50
  guidance_scale: 0.05
  plot_count: 0

evaluation:
  output_root: outputs/dps
  seed: 30233
  sample_count: 40
  batch_size: 4
  sampling_steps: 250
  guidance_scale: 0.05
  plot_count: 4
