experiment: known_channel_dps_smoke
seed: 233
device: cpu

dataset:
  path: datasets/smoke/dps_smoke.h5
  split_seed: 17
  split_ratios:
    train: 0.5
    validation: 0.25
    test: 0.25
  num_workers: 0

model:
  in_channels: 2
  out_channels: 2
  base_channels: 8
  channel_multipliers: [1, 2]
  num_res_blocks: 1
  dropout: 0.0

diffusion:
  steps: 8
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

training:
  output_root: outputs/smoke/train
  resume_output_dir: null
  epochs: 1
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 1.0
  save_every_epochs: 1
  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.0

validation:
  seed: 1017
  sample_count: 4
  batch_size: 4
  noise_repeats: 1

dps:
  sampling_steps: 4
  guidance_scale: 0.05
  likelihood: normalized
  measurement_eps: 1.0e-8
  clip_denoised: false

dps_validation:
  enabled: true
  every_epochs: 1
  seed: 2017
  sample_count: 4
  batch_size: 2
  sampling_steps: 4
  guidance_scale: 0.05
  plot_count: 0

evaluation:
  output_root: outputs/smoke/dps
  seed: 3017
  sample_count: 4
  batch_size: 2
  sampling_steps: 4
  guidance_scale: 0.05
  plot_count: 4
